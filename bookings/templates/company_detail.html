{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <!-- Company Header -->
            <div class="card mb-4">
                <div class="card-body text-center">
                    {% if company.logo %}
                        <img src="{{ company.logo.url }}" alt="{{ company.name }}" class="img-fluid mb-3" style="max-height: 200px;">
                    {% else %}
                        <div class="mb-3 p-4 bg-light rounded">
                            <i class="fas fa-building fa-5x text-muted"></i>
                        </div>
                    {% endif %}
                    
                    <h1 class="card-title mb-3">{{ company.name }}</h1>
                    
                    {% if company.description %}
                        <p class="card-text text-muted">{{ company.description }}</p>
                    {% endif %}
                </div>
            </div>

            <!-- Back Button -->
            <div class="mb-4">
                <a href="{% url 'index' %}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to All Packages
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
