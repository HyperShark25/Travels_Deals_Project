{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Travels & Deals</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    {% include 'navbar.html' %}
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      {{ message }}
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>
    {% endfor %}
    {% endif %}
    <div
      class="position-relative bg-dark rounded-5 overflow-hidden d-flex align-items-center justify-content-center mx-auto"
      style="height: 400px; width: 80%;"
    >
      <span
        class="fs-1 text-white position-absolute top-50 start-50 translate-middle"
        style="font-weight: 900;"
        >Welcome to Travels & Deals!</span
      >
      <img
        src="{% static 'stunning-landscape-swimming-pool-blue-sky-with-clouds-tropical-resort-hotel-in-maldives-fantastic-relax-and-peaceful-vibes-chairs-loungers-under-umbrella-and-palm-leaves-luxury-travel-vacation-photo.jpg' %}"
        class="opacity-50 w-100 h-100 object-fit-cover rounded-5"
        alt="Stunning Landscape"
      />
    </div>
    {% block content %}
    {% endblock content %}
  </body>
</html>
